<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Specificity</title>

  <style>
    /* 1. Element selector (lowest specificity) */
    h1 {
      font-size: 24px;
      color: yellow !important;
    }

    /* 2. Class selector */
    .main-header {
      font-size: 28px;
      color: blue;
    }

    /* 3. Attribute selector */
    [data-header="header"] {
      font-size: 32px;
      color: green;
    }

    /* 4. Pseudo-class selector */
    .main-header:hover {
      font-size: 36px;
      color: yellow !important;
    }

    h1:hover {
      /* This is less specific than the previous one */
      font-size: 16px;
      color: pink;
    }

    /* 5. ID selector */
    #header-id {
      font-size: 40px;
      color: red;
    }
  </style>
</head>

<body>

  <!-- ID selector -->
  <h1 id="header-id" class="main-header">
    Welcome to our website!
  </h1>

  <!-- Class selector -->
  <h1 class="main-header">
    Welcome to our website!
  </h1>

  <!-- Attribute selector -->
  <h1 data-header="header">
    Welcome to our website!
  </h1>

  <!-- Class selector -->
  <h1 class="main-header">
    Welcome to our website!
  </h1>

  <!-- Element selector -->
  <h1>
    Welcome to our website!
  </h1>

</body>

</html>
